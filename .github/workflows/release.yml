name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci
      - run: npm run release:check -- --tag "$GITHUB_REF_NAME"
      - run: npm run lint
      - run: npm run coverage
      - name: Stamp public release manifest
        run: node -e 'const fs=require("node:fs");const p="release-manifest.json";const m=JSON.parse(fs.readFileSync(p));m.latest.published_at=new Date().toISOString();fs.writeFileSync(p, JSON.stringify(m,null,2)+"\n")'
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-manifest.json#release-manifest.json --clobber
          elif [[ "$GITHUB_REF_NAME" == *-* ]]; then
            gh release create "$GITHUB_REF_NAME" release-manifest.json#release-manifest.json --verify-tag --generate-notes --prerelease
          else
            gh release create "$GITHUB_REF_NAME" release-manifest.json#release-manifest.json --verify-tag --generate-notes
          fi
